name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # What `npm run setup` does, but installing exactly the lockfile: a dependency
      # drift fails here instead of reaching the deploy. .env files come from the
      # examples (SQLite; webhook secret matches the e2e suite; AI off — keyless CI).
      - name: Install
        run: npm ci

      - name: Env files
        run: node copy-env.mjs apps/cms && node copy-env.mjs apps/web

      - name: Typecheck (cms)
        working-directory: apps/cms
        run: npx tsc --noEmit

      - name: Typecheck (web)
        working-directory: apps/web
        run: npx tsc --noEmit

      # The deploys run these builds; the dev servers below don't, so without
      # them a build-only error (admin bundle, a server/client boundary, route
      # config) would pass CI and break the deploy from master.
      - name: Build (cms)
        run: npm run build -w apps/cms

      - name: Build (web)
        run: npm run build -w apps/web

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # Boot the full stack with demo seed (the e2e suite's fixtures: dana/mark/priya,
      # pre-analyzed mentions for trends/themes/search). Keyless: AI features disabled,
      # which the suite covers explicitly.
      - name: Start stack (demo seed)
        run: |
          nohup npm run dev:demo > stack.log 2>&1 &
          npx wait-on -t 240000 http://localhost:1338/_health
          npx wait-on -t 120000 http://localhost:3000/sign-in

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            apps/web/test-results/
            stack.log
          retention-days: 7
